<!DOCTYPE html>
<head>
    <title>Работа с заказами</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="bg-secondary-subtle border-bottom border-dark-subtle px-3 py-2 fw-bold">
        Работа с заказами
    </div>

    <div class="p-3">
        <form method="get" action="">
            <div class="d-flex justify-content-between align-items-start mb-3 gap-3">

                <div>
                    <div class="d-flex align-items-center mb-2 gap-2">
                        <label for="filter_client" class="me-2 text-nowrap">Выберите заказчика</label>
                        <select name="filter_client" id="filter_client" class="form-select form-select-sm w-auto">
                            <option value="">Все</option>
                            {% for client in clients %}
                            <option value="{{ client.УИД_Контрагента }}"
                                {% if filter_client == client.УИД_Контрагента|stringformat:"s" %}selected{% endif %}>
                                {{ client.Наименование }}
                            </option>
                            {% endfor %}
                        </select>
                        <button type="submit" name="filter" value="1" class="btn btn-outline-secondary btn-sm text-nowrap">
                            Фильтровать
                        </button>
                        <button type="submit" name="show_all" value="1" class="btn btn-outline-secondary btn-sm text-nowrap">
                            Показать все
                        </button>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <label for="search" class="me-2 text-nowrap">Введите строку поиска</label>
                        <input type="text" name="search" id="search" value="{{ search }}" class="form-control form-control-sm w-auto">
                        <button type="submit" class="btn btn-outline-secondary btn-sm text-nowrap">
                            Найти
                        </button>
                    </div>
                </div>

                <div class="text-nowrap">
                    <div class="small mb-1">Выберите поле для сортировки</div>
                    <div class="d-flex align-items-start gap-2">
                        <select name="sort_field" size="3" class="form-select form-select-sm w-auto" onchange="this.form.submit()">
                            {% for field in sort_fields %}
                            <option value="{{ field }}" {% if sort_field == field %}selected{% endif %}>
                                {{ field }}
                            </option>
                            {% endfor %}
                        </select>

                        <div class="d-flex flex-column gap-1 pt-1">
                            <div class="form-check m-0">
                                <input class="form-check-input" type="radio" name="sort_dir" id="sortAsc" value="asc"
                                       {% if sort_dir == "asc" %}checked{% endif %} onchange="this.form.submit()">
                                <label class="form-check-label small" for="sortAsc">
                                    По возрастанию
                                </label>
                            </div>
                            <div class="form-check m-0">
                                <input class="form-check-input" type="radio" name="sort_dir" id="sortDesc" value="desc"
                                       {% if sort_dir == "desc" %}checked{% endif %} onchange="this.form.submit()">
                                <label class="form-check-label small" for="sortDesc">
                                    По убыванию
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <table class="table table-bordered table-sm border-secondary mb-3">
                <thead class="table-secondary">
                    <tr>
                        <th>Заказчик</th>
                        <th>Город</th>
                        <th>Телефон</th>
                        <th>Дата заказа</th>
                        <th>Сумма заказа</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in rows %}
                    <tr>
                        <td>{{ row.заказчик }}</td>
                        <td>{{ row.город }}</td>
                        <td>+{{ row.телефон }}</td>
                        <td>{{ row.дата }}</td>
                        <td>{{ row.сумма }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" class="text-center text-muted">
                            Нет данных
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <div>
                <div>Всего заказов: {{ total_count }}</div>
                <div>Общая сумма: {{ total_sum }}</div>
            </div>
        </form>
    </div>

</body>
</html>
